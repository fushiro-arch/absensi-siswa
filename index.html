
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Siswa</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #182b46);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      background: #fff;
      color: #172033;
      border-radius: 20px;
      box-shadow: 0 15px 40px #0005;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #172033;
    }

    input:focus, select:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 23px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #pesan {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 9px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .sukses {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .gagal {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>📚 Absensi Siswa</h1>
    <p class="subtitle">Formulir kehadiran siswa</p>

    <form id="formAbsensi">
      <label for="nama">Nama Siswa</label>
      <input
        type="text"
        id="nama"
        name="nama"
        placeholder="Masukkan nama lengkap"
        required
        maxlength="100"
      >

      <label for="status">Status Kehadiran</label>
      <select id="status" name="status" required>
        <option value="">-- Pilih Kehadiran --</option>
        <option value="Hadir">Hadir</option>
        <option value="Izin">Izin</option>
        <option value="Sakit">Sakit</option>
        <option value="Alpa">Alpa</option>
      </select>

      <label for="tanggal">Tanggal</label>
      <input
        type="date"
        id="tanggal"
        name="tanggal"
        required
      >

      <label for="waktu">Waktu</label>
      <input
        type="text"
        id="waktu"
        name="waktu"
        readonly
      >

      <button type="submit" id="tombolKirim">
        Kirim Absensi
      </button>

      <div id="pesan" role="status" aria-live="polite"></div>
    </form>

    <div class="footer">
      Sistem Absensi Siswa
    </div>
  </main>

  <script>
    // ===== KONFIGURASI EMAILJS =====

    const PUBLIC_KEY = "A607Op6M2VN9lRsLi";

    // GANTI dengan Service ID milik lu dari dashboard EmailJS
    const SERVICE_ID = "service_82qgoat";

    const TEMPLATE_ID = "template_u6zcwpy";

    emailjs.init({
      publicKey: PUBLIC_KEY
    });

    // ===== TANGGAL DAN WAKTU WIB =====

    function perbaruiWaktu() {
      const sekarang = new Date();

      const tanggal = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Jakarta",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(sekarang);

      const waktu = new Intl.DateTimeFormat("id-ID", {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(sekarang);

      document.getElementById("tanggal").value = tanggal;
      document.getElementById("waktu").value =
        waktu + " WIB";
    }

    perbaruiWaktu();
    setInterval(perbaruiWaktu, 1000);

    // ===== KIRIM ABSENSI KE EMAIL =====

    const form = document.getElementById("formAbsensi");
    const tombol = document.getElementById("tombolKirim");
    const pesan = document.getElementById("pesan");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (SERVICE_ID === "service_82qgoat") {
        pesan.className = "gagal";
        pesan.textContent =
          "Service ID EmailJS belum diisi. Periksa konfigurasi kode.";
        return;
      }

      if (!form.reportValidity()) return;

      tombol.disabled = true;
      tombol.textContent = "Mengirim...";
      pesan.className = "";
      pesan.style.display = "none";

      const data = {
        nama: document.getElementById("nama").value.trim(),
        status: document.getElementById("status").value,
        tanggal: document.getElementById("tanggal").value,
        waktu: document.getElementById("waktu").value
      };

      try {
        await emailjs.send(
          SERVICE_ID,
          TEMPLATE_ID,
          data
        );

        pesan.className = "sukses";
        pesan.textContent =
          "Absensi berhasil dikirim! Terima kasih.";

        form.reset();
        perbaruiWaktu();

      } catch (error) {
        console.error("EmailJS error:", error);

        pesan.className = "gagal";
        pesan.textContent =
          "Absensi gagal dikirim. Periksa Service ID, Template ID, dan konfigurasi EmailJS.";

      } finally {
        tombol.disabled = false;
        tombol.textContent = "Kirim Absensi";
      }
    });
  </script>
</body>
  </html>
