
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Kelas 9E - HadirYuk</title>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      color: #35264d;
      background: linear-gradient(135deg, #f5e9ff, #ffeaf3, #e9f3ff);
    }

    .container { max-width: 620px; margin: auto; }

    .hero, .form-card {
      background: rgba(255,255,255,.92);
      border: 1px solid #ffffff;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 12px 35px rgba(95,65,125,.12);
    }

    .hero { text-align: center; }

    .logo {
      display: inline-block;
      padding: 9px 15px;
      background: #f0e2ff;
      color: #7546a8;
      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
    }

    h1 { margin: 15px 0 8px; font-size: 28px; }
    .subtitle { color: #766887; line-height: 1.6; font-size: 14px; }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #e3d8ee;
      border-radius: 12px;
      background: #fff;
      color: #35264d;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus { border-color: #a77bdd; }

    button {
      width: 100%;
      border: 0;
      padding: 15px;
      margin-top: 22px;
      border-radius: 13px;
      background: linear-gradient(100deg, #9c68d7, #e17bb0);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .warning {
      text-align: center;
      color: #b53d61;
      font-size: 12px;
      margin-top: 12px;
      font-weight: bold;
    }

    .status {
      display: none;
      padding: 13px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .status.show { display: block; }
    .status.info { background: #f0e9ff; color: #6941a0; }
    .status.success { background: #e5f8eb; color: #236c3b; }
    .status.error { background: #ffebee; color: #a32d42; }

    footer {
      text-align: center;
      color: #8b7b9a;
      font-size: 12px;
      padding: 10px;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="hero">
      <div class="logo">✨ HadirYuk</div>
      <h1>Absensi Kelas 9E</h1>
      <p class="subtitle">
        Selamat datang di halaman absensi kelas 9E.
        Isi data dengan benar dan kirim absensi untuk mencatat kehadiran.
      </p>
    </section>

    <section class="form-card">
      <form id="attendanceForm">
        <label for="nama">Nama lengkap</label>
        <input
          id="nama"
          name="nama"
          type="text"
          placeholder="Masukkan nama lengkap"
          maxlength="100"
          required
        >

        <label for="status">Status kehadiran</label>
        <select id="status" name="status" required>
          <option value="">Pilih status kehadiran</option>
          <option value="Hadir">Hadir</option>
          <option value="Izin">Izin</option>
          <option value="Sakit">Sakit</option>
        </select>

        <button id="submitButton" type="submit">📨 Kirim Absensi</button>
        <p class="warning">Jika tidak ada absensi maka dinyatakan alpha!</p>
        <div id="message" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <footer>HadirYuk · Absensi Kelas 9E</footer>
  </main>

  <script>
    // Konfigurasi EmailJS
    const EMAILJS_PUBLIC_KEY = "A607Op6M2VN9lRsLi";
    const EMAILJS_SERVICE_ID = "service_82qgoat";
    const EMAILJS_TEMPLATE_ID = "template_u6zcwpy";

    // Konfigurasi Cloudinary
    const CLOUDINARY_CLOUD_NAME = "qna1hjte";
    const CLOUDINARY_UPLOAD_PRESET = "absensi_upload";

    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const form = document.getElementById("attendanceForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "status show " + type;
    }

    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Browser tidak mendukung GPS."));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          position => resolve({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          }),
          error => {
            const errors = {
              1: "Izin lokasi ditolak. Absensi dibatalkan.",
              2: "Lokasi tidak tersedia. Coba lagi.",
              3: "GPS terlalu lama merespons. Coba lagi."
            };
            reject(new Error(errors[error.code] || "Gagal mendapatkan lokasi."));
          },
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      });
    }

    async function capturePhoto(facingMode) {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("Kamera tidak didukung. Buka situs melalui HTTPS dan browser yang terbaru.");
      }

      let stream;

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        const video = document.createElement("video");
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.srcObject = stream;

        await new Promise((resolve, reject) => {
          video.onloadedmetadata = resolve;
          video.onerror = () => reject(new Error("Kamera gagal dibuka."));
          setTimeout(() => reject(new Error("Kamera terlalu lama merespons.")), 12000);
        });

        await video.play();

        if (!video.videoWidth || !video.videoHeight) {
          throw new Error("Gambar kamera tidak tersedia.");
        }

        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);

        return await new Promise((resolve, reject) => {
          canvas.toBlob(blob => {
            if (blob) resolve(blob);
            else reject(new Error("Gagal mengambil foto."));
          }, "image/jpeg", 0.82);
        });
      } finally {
        if (stream) stream.getTracks().forEach(track => track.stop());
      }
    }

    async function uploadPhoto(blob, label) {
      const data = new FormData();
      data.append("file", blob, label + ".jpg");
      data.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        { method: "POST", body: data }
      );

      const result = await response.json();

      if (!response.ok || !result.secure_url) {
        throw new Error("Upload foto " + label + " gagal. Periksa konfigurasi Cloudinary.");
      }

      return result.secure_url;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (button.disabled) return;

      const nama = document.getElementById("nama").value.trim();
      const status = document.getElementById("status").value;

      if (!nama || !status) {
        showMessage("Isi nama dan status kehadiran terlebih dahulu.", "error");
        return;
      }

      if (!window.isSecureContext) {
        showMessage("Buka website melalui HTTPS agar GPS dan kamera dapat digunakan.", "error");
        return;
      }

      button.disabled = true;

      try {
        showMessage("Meminta izin lokasi GPS...", "info");
        const location = await getLocation();

        showMessage("Meminta izin kamera depan...", "info");
        const frontPhoto = await capturePhoto("user");

        showMessage("Meminta izin kamera belakang...", "info");
        const backPhoto = await capturePhoto("environment");

        showMessage("Mengunggah foto absensi...", "info");
        const [fotoDepan, fotoBelakang] = await Promise.all([
          uploadPhoto(frontPhoto, "depan"),
          uploadPhoto(backPhoto, "belakang")
        ]);

        const now = new Date();
        const tanggal = now.toLocaleDateString("id-ID", {
          day: "2-digit", month: "long", year: "numeric"
        });
        const waktu = now.toLocaleTimeString("id-ID", {
          hour: "2-digit", minute: "2-digit", second: "2-digit"
        });

        const linkLokasi =
          `https://www.google.com/maps?q=${location.latitude},${location.longitude}`;

        showMessage("Mengirim data absensi ke email...", "info");

        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          nama: nama,
          status: status,
          tanggal: tanggal,
          waktu: waktu,
          lokasi: `${location.latitude}, ${location.longitude}`,
          link_lokasi: linkLokasi,
          foto_depan: fotoDepan,
          foto_belakang: fotoBelakang
        });

        showMessage("Absensi berhasil dikirim!", "success");
        form.reset();
      } catch (error) {
        console.error("Absensi gagal:", error);
        showMessage(
          error.message || "Absensi gagal dikirim. Periksa koneksi dan konfigurasi.",
          "error"
        );
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
